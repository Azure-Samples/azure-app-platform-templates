<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1176" width="1600" height="1176" preserveAspectRatio="xMidYMid meet" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Car-Seller Agent: Agentic Cloud Application</title>

  <style>
    :root {
      --bg:#ffffff; --ink:#16202b; --muted:#64748b; --line:#cbd5e1;
      --card:#ffffff; --soft:#f1f5f9; --accent:#d7263d; --accent-soft:#fdf2f4;
      --accent-line:#f0b8c1; --bar:#e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0f1620; --ink:#e8eef5; --muted:#93a3b6; --line:#33465c;
        --card:#16202b; --soft:#1b2733; --accent:#ff6b81; --accent-soft:#24161c;
        --accent-line:#6d3541; --bar:#2a3949;
      }
    }
    .bg    { fill: var(--bg); }
    .card  { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .soft  { fill: var(--soft); stroke: var(--line); stroke-width: 1.5; }
    .panel { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .gate  { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.75; }
    .chip  { fill: var(--card); stroke: var(--accent-line); stroke-width: 1.25; }
    .pill  { fill: var(--accent-soft); stroke: var(--accent-line); stroke-width: 1.25; }
    .bar   { fill: var(--bar); }
    .t     { fill: var(--ink); }
    .m     { fill: var(--muted); }
    .a     { fill: var(--accent); }
    .numT  { font-weight: 700; fill: var(--bg); font-size: 12px; }
    .cap   { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; }
    .lbl   { font-size: 12px; font-style: italic; }
    .sub   { font-size: 12.5px; }
    .node  { font-size: 17px; font-weight: 650; }
    .flow  { fill: none; stroke: var(--accent); stroke-width: 2; }
    .rail  { fill: none; stroke: var(--accent-line); stroke-width: 3; }
    .brace { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
    .rule  { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 6; }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 Z" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1176"/>

  <text class="t" x="70" y="66" font-size="32" font-weight="700" letter-spacing="-0.4">Car-Seller Agent</text>
  <text class="m" x="70" y="96" font-size="15">An agentic cloud application: from "show me EVs I can finance" to a human-approved deal in the customer's inbox</text>
  <text class="m cap" x="70" y="132">The runtime: front end to agent to AI Gateway, governing models and tools</text>
  <text class="m" x="1530" y="132" font-size="11.5" text-anchor="end">★ platform capability provided by Azure App Platform</text>

  <!-- 1. Front End -->
  <rect class="card" x="70" y="154" width="230" height="256" rx="14"/>
  <text class="a" x="90" y="192" font-size="15" font-weight="700">★ App Service Builder</text>
  <text class="t" x="90" y="218" font-size="16" font-weight="700">driveline-web</text>
  <text class="m" x="90" y="242" font-size="12">Buyer storefront &amp; chat UI</text>
  <rect class="soft" x="90" y="264" width="190" height="122" rx="10"/>
  <rect class="bar" x="106" y="282" width="158" height="14" rx="7"/>
  <rect class="bar" x="106" y="308" width="158" height="10" rx="5"/>
  <rect class="bar" x="106" y="328" width="122" height="10" rx="5"/>
  <text class="m" x="185" y="366" font-size="11" text-anchor="middle">Streams chat &amp; deal status</text>

  <!-- Front End -> Agent -->
  <path class="flow" d="M300,282 L354,282" marker-end="url(#arw)"/>
  <text class="m lbl" x="327" y="270" text-anchor="middle">/responses</text>

  <!-- 2. Agent -->
  <rect class="panel" x="360" y="154" width="240" height="256" rx="14"/>
  <text class="a" x="380" y="192" font-size="15" font-weight="700">★ Deal Finder Agent</text>
  <text class="t" x="380" y="218" font-size="14.5" font-weight="650">Foundry Hosted Agent /</text>
  <text class="t" x="380" y="238" font-size="14.5" font-weight="650">ACA Express</text>
  <text class="m" x="380" y="266" font-size="11.5">Orchestrates search, quote,</text>
  <text class="m" x="380" y="284" font-size="11.5">financing, and approval</text>
  <rect class="chip" x="380" y="308" width="200" height="36" rx="9"/>
  <text class="t" x="480" y="331" font-size="11" font-weight="600" text-anchor="middle">Responses · MCP client</text>
  <rect class="chip" x="380" y="354" width="200" height="36" rx="9"/>
  <text class="t" x="480" y="377" font-size="11" font-weight="600" text-anchor="middle">All egress via AI Gateway</text>

  <!-- Agent -> AI Gateway (single choke point) -->
  <path class="flow" d="M600,282 L654,282" marker-end="url(#arw)"/>
  <text class="m lbl" x="627" y="270" text-anchor="middle">all calls</text>

  <!-- 3. AI Gateway (vertical choke-point pillar) -->
  <rect class="gate" x="660" y="154" width="220" height="256" rx="14"/>
  <text class="a" x="680" y="188" font-size="16" font-weight="700">★ AI Gateway</text>
  <text class="m" x="680" y="208" font-size="11">Single governed choke point</text>
  <rect class="chip" x="678" y="224" width="184" height="42" rx="8"/>
  <text class="t" x="770" y="243" font-size="11.5" font-weight="650" text-anchor="middle">Model Aliases &amp; Routing</text>
  <text class="m" x="770" y="258" font-size="10" text-anchor="middle">gpt-latest · gpt-mini-latest</text>
  <rect class="chip" x="678" y="276" width="184" height="42" rx="8"/>
  <text class="t" x="770" y="295" font-size="11.5" font-weight="650" text-anchor="middle">Sandbox Mediation</text>
  <text class="m" x="770" y="310" font-size="10" text-anchor="middle">isolated session policy</text>
  <rect class="chip" x="678" y="328" width="184" height="42" rx="8"/>
  <text class="t" x="770" y="347" font-size="11.5" font-weight="650" text-anchor="middle">MCP &amp; Tool Policy</text>
  <text class="m" x="770" y="362" font-size="10" text-anchor="middle">auth · allowlists · limits</text>
  <text class="a" x="770" y="394" font-size="10.5" font-weight="700" text-anchor="middle">Zero direct bypass</text>

  <!-- 4. Out of AI Gateway: Models, ACA Sandboxes, Hosted Skills -->
  <path class="flow" d="M880,192 L924,192" marker-end="url(#arw)"/>
  <rect class="card" x="930" y="154" width="300" height="76" rx="12"/>
  <text class="t" x="950" y="184" font-size="14.5" font-weight="700">Foundry Models</text>
  <text class="m" x="950" y="205" font-size="11.5">gpt-6.2-sol · gpt-5-mini · Identity RBAC</text>

  <path class="flow" d="M880,282 L924,282" marker-end="url(#arw)"/>
  <rect class="pill" x="930" y="244" width="300" height="76" rx="12"/>
  <text class="a" x="950" y="274" font-size="14.5" font-weight="700">★ ACA Sandboxes (prequal)</text>
  <text class="m" x="950" y="295" font-size="11.5">Isolated PII &amp; loan math · Default-deny egress</text>

  <path class="flow" d="M880,372 L924,372" marker-end="url(#arw)"/>
  <rect class="chip" x="930" y="334" width="300" height="76" rx="12"/>
  <text class="t" x="950" y="364" font-size="14.5" font-weight="700">Hosted Skills · Functions MCP</text>
  <text class="m" x="950" y="385" font-size="11.5">inventory · trade-in · rate-sheet · deal-doc</text>

  <!-- 5. Connectors & Systems -->
  <path class="flow" d="M1230,372 L1284,372" marker-end="url(#arw)"/>
  <rect class="card" x="1290" y="244" width="240" height="166" rx="13"/>
  <text class="t" x="1312" y="280" font-size="15" font-weight="700">★ Connectors &amp; Data</text>
  <text class="m" x="1312" y="306" font-size="11.5">Inventory DB · EPA specs</text>
  <text class="m" x="1312" y="326" font-size="11.5">Dealership &amp; Lender APIs</text>
  <text class="m" x="1312" y="346" font-size="11.5">Teams approvals · Email (PII)</text>
  <text class="a" x="1312" y="382" font-size="11" font-weight="700">Managed auth &amp; data boundary</text>

  <text class="m cap" x="70" y="460">The deal, step by step</text>
  <path class="rail" d="M110,488 L1340,488"/>
  <rect class="card" x="70" y="508" width="230" height="214" rx="14"/>
  <text class="t" x="94" y="554" font-size="16.5" font-weight="700">Search &amp; discover</text>
  <text class="m" x="94" y="590" font-size="12.5">Customer describes what they</text>
  <text class="m" x="94" y="610" font-size="12.5">want; agent calls the</text>
  <text class="m" x="94" y="630" font-size="12.5">inventory-search Hosted Skill.</text>
  <rect class="pill" x="94" y="662" width="182" height="28" rx="14"/>
  <text class="a" x="185" y="680" font-size="11" font-weight="700" text-anchor="middle">inventory-search</text>
  <rect class="card" x="316" y="508" width="230" height="214" rx="14"/>
  <text class="t" x="340" y="554" font-size="16.5" font-weight="700">Get a price quote</text>
  <text class="m" x="340" y="590" font-size="12.5">Live stock, trade-in value,</text>
  <text class="m" x="340" y="610" font-size="12.5">and net price computed</text>
  <text class="m" x="340" y="630" font-size="12.5">for shortlisted cars.</text>
  <rect class="pill" x="340" y="662" width="182" height="28" rx="14"/>
  <text class="a" x="431" y="680" font-size="11" font-weight="700" text-anchor="middle">trade-in-value</text>
  <rect class="card" x="562" y="508" width="230" height="214" rx="14"/>
  <text class="t" x="586" y="554" font-size="16.5" font-weight="700">Evaluate PII safely</text>
  <text class="m" x="586" y="590" font-size="12.5">Borrower income, SSN, and</text>
  <text class="m" x="586" y="610" font-size="12.5">pre-qual run isolated inside</text>
  <text class="m" x="586" y="630" font-size="12.5">the sandbox boundary.</text>
  <rect class="pill" x="586" y="662" width="182" height="28" rx="14"/>
  <text class="a" x="677" y="680" font-size="11" font-weight="700" text-anchor="middle">PII · ACA Sandbox</text>
  <rect class="card" x="808" y="508" width="230" height="214" rx="14"/>
  <text class="t" x="832" y="554" font-size="16.5" font-weight="700">Get financing</text>
  <text class="m" x="832" y="590" font-size="12.5">36, 48, and 60-month APR</text>
  <text class="m" x="832" y="610" font-size="12.5">and payment options come</text>
  <text class="m" x="832" y="630" font-size="12.5">back from rate-sheet.</text>
  <rect class="pill" x="832" y="662" width="182" height="28" rx="14"/>
  <text class="a" x="923" y="680" font-size="11" font-weight="700" text-anchor="middle">rate-sheet</text>
  <rect class="card" x="1054" y="508" width="230" height="214" rx="14"/>
  <text class="t" x="1078" y="554" font-size="16.5" font-weight="700">Human approval</text>
  <text class="m" x="1078" y="590" font-size="12.5">The packaged deal goes to a</text>
  <text class="m" x="1078" y="610" font-size="12.5">manager in Teams, who signs</text>
  <text class="m" x="1078" y="630" font-size="12.5">off or sends it back.</text>
  <rect class="pill" x="1078" y="662" width="182" height="28" rx="14"/>
  <text class="a" x="1169" y="680" font-size="11" font-weight="700" text-anchor="middle">Teams · DTS</text>
  <rect class="card" x="1300" y="508" width="230" height="214" rx="14"/>
  <text class="t" x="1324" y="554" font-size="16.5" font-weight="700">Email the customer</text>
  <text class="m" x="1324" y="590" font-size="12.5">Offer sheet generated by</text>
  <text class="m" x="1324" y="610" font-size="12.5">deal-doc and emailed; state</text>
  <text class="m" x="1324" y="630" font-size="12.5">saved in DTS.</text>
  <rect class="pill" x="1324" y="662" width="182" height="28" rx="14"/>
  <text class="a" x="1415" y="680" font-size="11" font-weight="700" text-anchor="middle">deal-doc · Email</text>
  <circle class="a" cx="110" cy="488" r="19"/><text class="numT" x="110" y="492" text-anchor="middle" font-size="15">1</text>
  <circle class="a" cx="356" cy="488" r="19"/><text class="numT" x="356" y="492" text-anchor="middle" font-size="15">2</text>
  <circle class="a" cx="602" cy="488" r="19"/><text class="numT" x="602" y="492" text-anchor="middle" font-size="15">3</text>
  <circle class="a" cx="848" cy="488" r="19"/><text class="numT" x="848" y="492" text-anchor="middle" font-size="15">4</text>
  <circle class="a" cx="1094" cy="488" r="19"/><text class="numT" x="1094" y="492" text-anchor="middle" font-size="15">5</text>
  <circle class="a" cx="1340" cy="488" r="19"/><text class="numT" x="1340" y="492" text-anchor="middle" font-size="15">6</text>
  <text class="m cap" x="70" y="774">Always running behind the scenes</text>
  <rect class="card" x="70" y="792" width="760" height="230" rx="14"/>
  <text class="t" x="94" y="826" font-size="17" font-weight="700">Inventory ingestion &amp; stock health</text>
  <text class="m sub" x="94" y="848">A Hosted Skill running as an Azure Function on a schedule, outside the request path</text>
  <rect class="soft" x="94" y="872" width="210" height="80" rx="12"/>
  <text class="t" x="112" y="907" font-size="15" font-weight="650">Dealer &amp; EPA feeds</text>
  <text class="m" x="112" y="928" font-size="11.5">listings, range, pricing</text>
  <rect class="soft" x="354" y="872" width="210" height="80" rx="12"/>
  <text class="t" x="372" y="907" font-size="15" font-weight="650">Azure Function</text>
  <text class="m" x="372" y="928" font-size="11.5">★ Hosted Skill · scheduled</text>
  <rect class="soft" x="614" y="872" width="210" height="80" rx="12"/>
  <text class="t" x="632" y="907" font-size="15" font-weight="650">Inventory DB</text>
  <text class="m" x="632" y="928" font-size="11.5">normalized, searchable</text>
  <path class="flow" d="M304,912 L350,912" marker-end="url(#arw)"/>
  <path class="flow" d="M564,912 L610,912" marker-end="url(#arw)"/>
  <text class="a" x="719" y="976" font-size="11" font-weight="700" text-anchor="middle">step 1 searches this DB</text>
  <rect class="card" x="856" y="792" width="340" height="230" rx="14"/>
  <text class="t" x="880" y="826" font-size="17" font-weight="700">DTS</text>
  <text class="m sub" x="880" y="848">Durable state for everything</text>
  <path class="soft" d="M966,874 L966,930 A60,15 0 0 0 1086,930 L1086,874 Z"/>
  <ellipse class="soft" cx="1026" cy="874" rx="60" ry="15"/>
  <text class="t" x="1026" y="912" font-size="16" font-weight="700" text-anchor="middle">DTS</text>
  <text class="m" x="880" y="970" font-size="12">Conversation, deal, and approval state</text>
  <text class="m" x="880" y="988" font-size="12">so customers and managers pick up</text>
  <text class="m" x="880" y="1006" font-size="12">exactly where they left off.</text>
  <rect class="card" x="1222" y="792" width="308" height="230" rx="14"/>
  <text class="a" x="1246" y="826" font-size="17" font-weight="700">★ ACA Sandboxes</text>
  <text class="m sub" x="1246" y="848">The PII boundary</text>
  <rect class="pill" x="1246" y="870" width="260" height="60" rx="12"/>
  <text class="a" x="1376" y="906" font-size="14" font-weight="700" text-anchor="middle">PII never leaves the sandbox</text>
  <text class="m" x="1246" y="970" font-size="12">The agent runs financing math and</text>
  <text class="m" x="1246" y="988" font-size="12">customer data inside an isolated</text>
  <text class="m" x="1246" y="1006" font-size="12">session, returning only the verdict.</text>
  <rect x="70" y="1062" width="1460" height="70" rx="14" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="a" x="94" y="1094" font-size="17" font-weight="700">★ SRE Agent</text>
  <text class="m sub" x="94" y="1116">Observability · evals · guardrails · human-approved remediation across front end, agent, gateway, sandboxes, and skills</text>
</svg>
