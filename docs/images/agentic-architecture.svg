<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 960" width="1520" height="960" preserveAspectRatio="xMidYMid meet" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Agentic Cloud Application: Dealership Reference Architecture</title>

  <style>
    :root {
      --bg:#ffffff; --ink:#16202b; --muted:#64748b; --line:#cbd5e1;
      --card:#ffffff; --soft:#f1f5f9; --accent:#d7263d; --accent-soft:#fdf2f4;
      --accent-line:#f0b8c1; --bar:#e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0f1620; --ink:#e8eef5; --muted:#93a3b6; --line:#33465c;
        --card:#16202b; --soft:#1b2733; --accent:#ff6b81; --accent-soft:#24161c;
        --accent-line:#6d3541; --bar:#2a3949;
      }
    }
    .bg    { fill: var(--bg); }
    .card  { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .soft  { fill: var(--soft); stroke: var(--line); stroke-width: 1.5; }
    .panel { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .gate  { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.25; }
    .chip  { fill: var(--card); stroke: var(--accent-line); stroke-width: 1.25; }
    .pill  { fill: var(--accent-soft); stroke: var(--accent-line); stroke-width: 1.5; }
    .bar   { fill: var(--bar); }
    .t     { fill: var(--ink); }
    .m     { fill: var(--muted); }
    .a     { fill: var(--accent); }
    .numT  { font-weight: 700; fill: var(--bg); font-size: 12px; }
    .cap   { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .lbl   { font-size: 12px; font-style: italic; }
    .sub   { font-size: 12px; }
    .node  { font-size: 16px; font-weight: 650; }
    .flow  { fill: none; stroke: var(--accent); stroke-width: 2.2; }
    .brace { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.6 L10,5 L0,9.4 Z" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1520" height="960"/>

  <!-- Header -->
  <text class="t" x="50" y="58" font-size="30" font-weight="700" letter-spacing="-0.4">Agentic Cloud Application</text>
  <text class="m" x="50" y="86" font-size="15">Dealership reference architecture: front end to agent to AI Gateway, governing models and tools</text>

  <!-- Column headers -->
  <text class="m cap" x="50" y="134">1 · Front End</text>
  <text class="m cap" x="310" y="134">2 · Agent</text>
  <text class="m cap" x="600" y="134">3 · Gateway</text>
  <text class="m cap" x="890" y="134">4 · Models &amp; Tools</text>
  <text class="m cap" x="1270" y="134">5 · Systems</text>

  <!-- 1. FRONT END: App Service Builder (driveline-web) -->
  <rect class="card" x="50" y="256" width="190" height="250" rx="16"/>
  <rect class="soft" x="66" y="274" width="158" height="154" rx="10"/>
  <rect class="bar" x="80" y="290" width="130" height="13" rx="6.5"/>
  <text class="t" x="145" y="330" font-size="15" font-weight="700" text-anchor="middle">driveline-web</text>
  <text class="m" x="145" y="349" font-size="11" text-anchor="middle">Buyer chat &amp; shortlist</text>
  <rect class="bar" x="80" y="366" width="130" height="9" rx="4.5"/>
  <rect class="bar" x="80" y="383" width="130" height="9" rx="4.5"/>
  <rect class="bar" x="80" y="400" width="94" height="9" rx="4.5"/>
  <text class="a" x="66" y="456" font-size="13.5" font-weight="700">★ App Service Builder</text>
  <text class="m sub" x="66" y="477">Next.js web surface</text>

  <!-- Front End -> Agent -->
  <path class="flow" d="M240,381 L304,381" marker-end="url(#arw)"/>
  <text class="m lbl" x="272" y="368" text-anchor="middle">/responses</text>

  <!-- 2. AGENT: deal-finder -->
  <rect class="panel" x="310" y="286" width="220" height="190" rx="16"/>
  <text class="a cap" x="332" y="320">★ Agent Host</text>
  <text class="t" x="332" y="352" font-size="22" font-weight="700">deal-finder</text>
  <text class="m sub" x="332" y="376">Foundry Hosted Agent /</text>
  <text class="m sub" x="332" y="394">ACA Express</text>
  <rect class="chip" x="332" y="414" width="176" height="40" rx="9"/>
  <text class="t" x="420" y="439" font-size="11.5" font-weight="600" text-anchor="middle">Responses · MCP client</text>

  <!-- Agent -> AI Gateway (SINGLE GOVERNED CHOKE POINT) -->
  <path class="flow" d="M530,381 L594,381" marker-end="url(#arw)"/>
  <text class="m lbl" x="562" y="368" text-anchor="middle">all calls</text>

  <!-- 3. AI GATEWAY (Full-Height Governed Choke-Point Wall) -->
  <rect class="gate" x="600" y="156" width="210" height="606" rx="16"/>
  <text class="a" x="622" y="196" font-size="18.5" font-weight="700">★ AI Gateway</text>
  <text class="m sub" x="622" y="218">Single governed choke point</text>
  <text class="m sub" x="622" y="235">for every outbound agent call</text>

  <rect class="chip" x="620" y="264" width="170" height="68" rx="10"/>
  <text class="t" x="705" y="292" font-size="12.5" font-weight="700" text-anchor="middle">Model Aliases</text>
  <text class="m" x="705" y="311" font-size="10.5" text-anchor="middle">gpt-latest · gpt-mini-latest</text>

  <rect class="chip" x="620" y="352" width="170" height="68" rx="10"/>
  <text class="t" x="705" y="380" font-size="12.5" font-weight="700" text-anchor="middle">Sandbox Mediation</text>
  <text class="m" x="705" y="399" font-size="10.5" text-anchor="middle">isolated session policy</text>

  <rect class="chip" x="620" y="440" width="170" height="68" rx="10"/>
  <text class="t" x="705" y="468" font-size="12.5" font-weight="700" text-anchor="middle">MCP &amp; Tool Policy</text>
  <text class="m" x="705" y="487" font-size="10.5" text-anchor="middle">auth · allowlists · limits</text>

  <rect class="chip" x="620" y="528" width="170" height="68" rx="10"/>
  <text class="t" x="705" y="556" font-size="12.5" font-weight="700" text-anchor="middle">Safety &amp; Telemetry</text>
  <text class="m" x="705" y="575" font-size="10.5" text-anchor="middle">Prompt Shields · OTel</text>

  <rect class="chip" x="620" y="616" width="170" height="68" rx="10"/>
  <text class="t" x="705" y="644" font-size="12.5" font-weight="700" text-anchor="middle">Workflow &amp; Comms</text>
  <text class="m" x="705" y="663" font-size="10.5" text-anchor="middle">governed handoffs</text>

  <text class="a" x="705" y="726" font-size="11.5" font-weight="700" text-anchor="middle">Zero direct bypass</text>

  <!-- 4A. AI Gateway -> Foundry Models -->
  <path class="flow" d="M810,204 L884,204" marker-end="url(#arw)"/>
  <rect class="card" x="890" y="156" width="320" height="96" rx="14"/>
  <text class="t node" x="912" y="190">Foundry Models</text>
  <text class="m sub" x="912" y="212">gpt-6.2-sol · gpt-5-mini</text>
  <text class="m" x="912" y="232" font-size="11">Managed identity RBAC</text>

  <!-- 4B. AI Gateway -> ACA Sandboxes (prequal) -->
  <path class="flow" d="M810,340 L884,340" marker-end="url(#arw)"/>
  <circle class="a" cx="847" cy="320" r="11"/><text class="numT" x="847" y="324" text-anchor="middle">3</text>

  <rect class="pill" x="890" y="276" width="320" height="128" rx="14"/>
  <text class="a" x="912" y="310" font-size="16.5" font-weight="700">★ ACA Sandboxes (prequal)</text>
  <text class="t" x="912" y="333" font-size="12" font-weight="600">Hardware-isolated loan &amp; PII evaluation</text>
  <text class="m sub" x="912" y="353">Default-deny egress · zero shared secrets</text>
  <rect class="chip" x="912" y="366" width="224" height="24" rx="7"/>
  <text class="a" x="1024" y="382" font-size="11" font-weight="700" text-anchor="middle">Raw PII never leaves the sandbox</text>

  <!-- 4C. AI Gateway -> Hosted Skills (4 Azure Functions MCP) -->
  <path class="flow" d="M810,518 L884,518" marker-end="url(#arw)"/>
  <circle class="a" cx="834" cy="496" r="11"/><text class="numT" x="834" y="500" text-anchor="middle">1</text>
  <circle class="a" cx="860" cy="496" r="11"/><text class="numT" x="860" y="500" text-anchor="middle">2</text>
  <circle class="a" cx="847" cy="542" r="11"/><text class="numT" x="847" y="546" text-anchor="middle">4</text>

  <rect class="card" x="890" y="428" width="320" height="178" rx="14"/>
  <text class="t" x="912" y="460" font-size="16.5" font-weight="700">Hosted Skills · Functions MCP</text>
  <text class="m sub" x="912" y="481">Domain tools (/runtime/webhooks/mcp)</text>
  <rect class="soft" x="912" y="498" width="134" height="36" rx="8"/>
  <text class="t" x="979" y="520" font-size="11.5" font-weight="600" text-anchor="middle">inventory-search</text>
  <rect class="soft" x="1056" y="498" width="134" height="36" rx="8"/>
  <text class="t" x="1123" y="520" font-size="11.5" font-weight="600" text-anchor="middle">trade-in-value</text>
  <rect class="soft" x="912" y="544" width="134" height="36" rx="8"/>
  <text class="t" x="979" y="566" font-size="11.5" font-weight="600" text-anchor="middle">rate-sheet</text>
  <rect class="soft" x="1056" y="544" width="134" height="36" rx="8"/>
  <text class="t" x="1123" y="566" font-size="11.5" font-weight="600" text-anchor="middle">deal-doc</text>

  <!-- 5. Systems of Record on Right -->
  <rect class="card" x="1270" y="286" width="196" height="76" rx="12"/>
  <text class="t node" x="1288" y="317">Inventory &amp; EPA</text>
  <text class="m sub" x="1288" y="339">Stock · range · pricing</text>

  <rect class="card" x="1270" y="382" width="196" height="76" rx="12"/>
  <text class="t node" x="1288" y="413">Dealer &amp; Lenders</text>
  <text class="m sub" x="1288" y="435">Quotes · APR sheets</text>

  <rect class="card" x="1270" y="478" width="196" height="76" rx="12"/>
  <text class="t node" x="1288" y="509">Customer Email</text>
  <rect class="pill" x="1414" y="493" width="38" height="20" rx="10"/>
  <text class="a" x="1433" y="507" font-size="10.5" font-weight="700" text-anchor="middle">PII</text>
  <text class="m sub" x="1288" y="531">Signed offer delivery</text>

  <path class="flow" d="M1210,504 C1240,504 1240,324 1264,324" marker-end="url(#arw)"/>
  <path class="flow" d="M1210,534 C1240,534 1240,420 1264,420" marker-end="url(#arw)"/>
  <path class="brace" d="M1474,286 C1484,286 1484,296 1484,306 L1484,408 C1484,418 1492,420 1492,420 C1484,420 1484,422 1484,432 L1484,534 C1484,544 1484,554 1474,554"/>
  <text class="a" x="1506" y="420" font-size="12.5" font-weight="700" text-anchor="middle" transform="rotate(90 1506 420)">★ Connectors</text>

  <!-- 4D. AI Gateway -> Durable Workflows (DTS) & Teams Human Approval -->
  <path class="flow" d="M810,696 L884,696" marker-end="url(#arw)"/>
  <circle class="a" cx="847" cy="674" r="11"/><text class="numT" x="847" y="678" text-anchor="middle">5</text>

  <rect class="card" x="890" y="630" width="320" height="132" rx="14"/>
  <text class="t node" x="912" y="664">Durable Workflows &amp; Teams</text>
  <text class="m sub" x="912" y="686">DTS LoanApprovalOrchestrator routes</text>
  <text class="m sub" x="912" y="704">deal for finance manager sign-off</text>
  <text class="a" x="912" y="732" font-size="11.5" font-weight="700">Stateful checkpoint &amp; human approval</text>

  <path class="flow" d="M1210,696 C1248,696 1242,524 1264,524" marker-end="url(#arw)"/>
  <circle class="a" cx="1238" cy="618" r="11"/><text class="numT" x="1238" y="622" text-anchor="middle">6</text>

  <!-- Deal flow compact legend on bottom-left -->
  <text class="m cap" x="50" y="556">Deal flow</text>
  <circle class="a" cx="62" cy="582" r="10"/><text class="numT" x="62" y="586" text-anchor="middle">1</text>
  <text class="t sub" x="82" y="587">Search inventory EVs</text>
  <circle class="a" cx="62" cy="610" r="10"/><text class="numT" x="62" y="614" text-anchor="middle">2</text>
  <text class="t sub" x="82" y="615">Value trade-in &amp; quote</text>
  <circle class="a" cx="62" cy="638" r="10"/><text class="numT" x="62" y="642" text-anchor="middle">3</text>
  <text class="t sub" x="82" y="643">Evaluate PII in Sandbox</text>
  <circle class="a" cx="62" cy="666" r="10"/><text class="numT" x="62" y="670" text-anchor="middle">4</text>
  <text class="t sub" x="82" y="671">Compare APR rate sheet</text>
  <circle class="a" cx="62" cy="694" r="10"/><text class="numT" x="62" y="698" text-anchor="middle">5</text>
  <text class="t sub" x="82" y="699">Approve deal in Teams</text>
  <circle class="a" cx="62" cy="722" r="10"/><text class="numT" x="62" y="726" text-anchor="middle">6</text>
  <text class="t sub" x="82" y="727">Email binding offer</text>

  <!-- Self-Awareness Plane across every layer -->
  <rect x="50" y="804" width="1416" height="82" rx="14" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="a" x="78" y="840" font-size="17" font-weight="700">★ SRE Agent · Self-Awareness Plane</text>
  <text class="m sub" x="78" y="864">OpenTelemetry traces · App Insights &amp; Log Analytics · continuous evals · Review / Autonomous remediation across front end, agent, gateway, sandboxes, and skills</text>

  <text class="m sub" x="50" y="924">★ platform capability provided by Azure App Platform</text>
</svg>
